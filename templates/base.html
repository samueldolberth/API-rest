<!DOCTYPE html>

    <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>
<body>

    <header class="cabecalho">

        <nav class="menu">
            <a class="menu-link" href="{{ url_for('index') }}">Início</a>

    <footer class="rodape">

    </footer>
