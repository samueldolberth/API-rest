{% extends "base.html" %}
{% block content %}
<h2>Editar produto</h2>
<form method="POST">
    <label for="nome">Nome:</label>
    <input type="text" id="nome" name="nome" value="{{ produto.nome }}">

    <label for="preco">Preço:</label>
    <input type="number" id="preco" name="preco" step="0.01" value="{{ produto.preco }}">

    <label for="categoria">Categoria:</label>
    <select id="categoria" name="categoria">
        <option value="Informática" {% if produto.categoria=="Informática" %} selected {% endif %}>
            Informática
        </option>
        <option value="Acessórios" {% if produto.categoria=="Acessórios" %} selected {% endif %}>
            Acessórios
        </option>
    </select>

    <label for="descricao">Descrição:</label>
    <textarea id="descricao" name="descricao">
        {{ produto.descricao }}</textarea>
    <button type="submit">Salvar</button>
</form>
{% endblock %}
